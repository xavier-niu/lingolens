name: Test, build and push Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TGGW_MESSAGES_URL: ${{ vars.TGGW_MESSAGES_URL || 'https://tggw.xavierniu.cc/api/messages' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go unit and integration tests (store, importer, LLM clients, HTTP API).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      # Type-checks and builds the web app, so the Go tests check what it ships.
      - name: Build web app
        working-directory: web/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: go vet ./...
      - run: go test -race ./...

  # Browser tests (e2e/): the real server with the Fake model, driven by Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            web/ui/package-lock.json
      - name: Build web app
        working-directory: web/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build server
        run: CGO_ENABLED=0 go build -o e2e/.bin/lingolens ./cmd/lingolens
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: e2e
        run: node run.mjs
      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-out
          path: e2e/out
          retention-days: 7

  docker:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Repository secrets:
    #   DOCKERHUB_TOKEN     Docker Hub access token, Read & Write scope (required to push)
    #   DOCKERHUB_USERNAME  Docker Hub user or organisation (default: xavierniu)
    #   DOCKERHUB_REPO      repository name (default: lingolens)
    #   TGGW_API_TOKEN      tggw token, for a Telegram message once the image is pushed
    #                       (without it the message is skipped)
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'xavierniu' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'xavierniu' }}/${{ secrets.DOCKERHUB_REPO || 'lingolens' }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # "latest" follows the default branch (main or master); v1.2.3 tags also get 1.2.3 and 1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify tggw
        if: success() && env.PUSH == 'true'
        env:
          TGGW_API_TOKEN: ${{ secrets.TGGW_API_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${TGGW_API_TOKEN}" ]; then
            echo "::warning::TGGW_API_TOKEN is not set; skipping the tggw message"
            exit 0
          fi
          # The tag people pull: the version for a v* tag, latest for the default branch.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$META_VERSION"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then tag="latest"
          else tag="$GITHUB_REF_NAME"; fi
          hub_url="https://hub.docker.com/r/${IMAGE}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          digest_hex="${IMAGE_DIGEST#sha256:}"
          message="$(printf '%s\n' \
            "<b>GitHub Actions</b>" \
            "Docker image <a href=\"${hub_url}\">${IMAGE}:${tag}</a> has been pushed" \
            "digest: ${digest_hex:0:8}" \
            "commit: <a href=\"${commit_url}\">${GITHUB_SHA:0:8}</a>" \
            "link: <a href=\"${run_url}\">GitHub Workflow</a>")"

          curl -fsS -X POST "$TGGW_MESSAGES_URL" \
            -H "Authorization: Bearer ${TGGW_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$message" '{text: $text, parse_mode: "HTML"}')"

  # A failed test or build, on a push that would have published an image.
  notify-failure:
    needs: [test, e2e, docker]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'xavierniu' }}/${{ secrets.DOCKERHUB_REPO || 'lingolens' }}
    steps:
      - name: Notify tggw on failure
        env:
          TGGW_API_TOKEN: ${{ secrets.TGGW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TGGW_API_TOKEN}" ]; then
            echo "::warning::TGGW_API_TOKEN is not set; skipping the tggw message"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          message="$(printf '%s\n' \
            "<b>GitHub Actions</b>" \
            "Docker image ${IMAGE} publish failed" \
            "commit: <a href=\"${commit_url}\">${GITHUB_SHA:0:8}</a>" \
            "link: <a href=\"${run_url}\">GitHub Workflow</a>")"

          curl -fsS -X POST "$TGGW_MESSAGES_URL" \
            -H "Authorization: Bearer ${TGGW_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$message" '{text: $text, parse_mode: "HTML"}')"
