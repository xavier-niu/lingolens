name: Test, build and push Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go unit and integration tests (store, importer, LLM clients, HTTP API).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # Browser tests (e2e/): the real server with the Fake model, driven by Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build server
        run: CGO_ENABLED=0 go build -o e2e/.bin/lingolens ./cmd/lingolens
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: e2e
        run: node run.mjs
      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-out
          path: e2e/out
          retention-days: 7

  docker:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Repository secrets:
    #   DOCKERHUB_TOKEN     Docker Hub access token, Read & Write scope (required to push)
    #   DOCKERHUB_USERNAME  Docker Hub user or organisation (default: xavierniu)
    #   DOCKERHUB_REPO      repository name (default: lingolens)
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'xavierniu' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'xavierniu' }}/${{ secrets.DOCKERHUB_REPO || 'lingolens' }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # "latest" follows the default branch (main or master); v1.2.3 tags also get 1.2.3 and 1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
